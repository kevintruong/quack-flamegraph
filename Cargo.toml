[package]
name = "quack_flamegraph"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "DuckDB extension for querying Brendan Gregg folded CPU/allocation profiles"
repository = "https://github.com/kevintruong/quack-flamegraph"

[lib]
crate-type = ["cdylib"]

[profile.release]
lto = true
strip = true

[[example]]
# crate-type can't be (at the moment) be overriden for specific targets
# src/wasm_lib.rs forwards to src/lib.rs so that we can change from cdylib
# (that is needed while compiling natively) to staticlib (needed since the
# actual linking will be done via emcc
name = "quack_flamegraph"
path = "src/wasm_lib.rs"
crate-type = ["staticlib"]

[dependencies]
duckdb = { version = "~1.10506.0", features = ["loadable-extension"] }
